name: PrQualityCheck

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Needed to push fixes
      pull-requests: write # Needed to comment

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Auto-Format Code
        run: |
          # 1. Sort Imports (Isort via Ruff)
          uv run ruff check --select I --fix .
          # 2. Reformat Code (Black style via Ruff)
          uv run ruff format .

      - name: Auto-Bump Version (if needed)
        run: |
          uv run python - <<'EOF'
          import re
          import subprocess
          from pathlib import Path

          VERSION_FILE = Path("quasarr/providers/version.py")

          def get_version_from_content(content):
              m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', content)
              return m.group(1) if m else None

          def get_main_version():
              try:
                  subprocess.run(["git", "fetch", "origin", "main"], check=True, capture_output=True)
                  base_ref = subprocess.check_output(["git", "merge-base", "HEAD", "origin/main"], text=True).strip()
                  subprocess.run(["git", "checkout", base_ref, "--", str(VERSION_FILE)], check=True, capture_output=True)
                  content = VERSION_FILE.read_text()
                  # Restore file to HEAD immediately
                  subprocess.run(["git", "checkout", "HEAD", "--", str(VERSION_FILE)], check=True, capture_output=True)
                  return get_version_from_content(content)
              except Exception as e:
                  print(f"Error fetching main version: {e}")
                  return "0.0.0"

          def bump_patch(v_str):
              parts = v_str.split('.')
              while len(parts) < 3: parts.append('0')
              try:
                  parts[-1] = str(int(parts[-1]) + 1)
              except ValueError:
                  parts.append('1')
              return ".".join(parts)

          current_content = VERSION_FILE.read_text()
          current_ver = get_version_from_content(current_content)
          main_ver = get_main_version()

          print(f"Main: {main_ver} | Current: {current_ver}")

          if current_ver == main_ver:
              new_ver = bump_patch(current_ver)
              print(f"Bumping version: {current_ver} -> {new_ver}")
              new_content = current_content.replace(f'"{current_ver}"', f'"{new_ver}"')
              VERSION_FILE.write_text(new_content)
          else:
              print("Version already newer or changed. Skipping bump.")
          EOF

      - name: Commit and Push Changes
        id: git_push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ `git status --porcelain` ]]; then
            echo "Changes detected. Pushing..."
            git add .
            git commit -m "chore: auto-format and bump version [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
            echo "PUSHED=true" >> $GITHUB_ENV
          else
            echo "PUSHED=false" >> $GITHUB_ENV
          fi

      - name: Notify User
        if: env.PUSHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "
          ### 🤖 Auto-Fix Applied
          
          I detected some unformatted code or an unchanged version number, so I fixed it for you.
          
          **Action Required:**
          Please pull the changes to your local branch to stay in sync:
          \`\`\`bash
          git pull origin ${{ github.head_ref }}
          \`\`\`
          
          ---
          #### 💡 For future reference:
          
          **1. To check formatting before pushing:**
          \`\`\`bash
          uv run ruff check --select I --fix .  # Fix imports
          uv run ruff format .                  # Fix layout
          \`\`\`
          
          **2. To update the version manually:**
          Edit the \`__version__\` string in:
          \`quasarr/providers/version.py\`
          "
