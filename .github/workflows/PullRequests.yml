name: Pull Requests

on:
  workflow_dispatch:
    inputs:
      auto_fix_followup:
        default: false
        description: Read-only follow-up after bot auto-fix
        type: boolean
  pull_request:

concurrency:
  # Key on the branch, not github.ref: pull_request events see refs/pull/N/merge
  # while workflow_dispatch sees refs/heads/dev, so keying on github.ref put
  # runs for the same branch in different groups and let them race. Include
  # the source repository so a fork's dev branch cannot cancel our dev runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GHCR_ENDPOINT: "ghcr.io/rix1337/quasarr"
  DESCRIPTION: "Quasarr connects JDownloader with Radarr, Sonarr and Magazarr."
  # Must match Release.yml UV_VERSION and [tool.uv] required-version.
  # The lock `revision` field is
  # uv-version-specific; if local uv and CI uv diverge, the lock ping-pongs
  # between them as endless one-line chore commits.
  UV_VERSION: "0.11.3"

jobs:
  quality-check:
    name: Check & Auto-Fix
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      changes_pushed: ${{ steps.manager.outputs.changes_pushed }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: |
          echo "🐍 Installing Python 3.12..."
          uv python install 3.12

      - name: Run Maintenance
        id: manager
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          FOLLOWUP: ${{ inputs.auto_fix_followup }}
        run: |
          # Fork PRs cannot receive bot pushes. The dispatched auto-fix
          # follow-up also runs read-only to verify the pushed commit.
          if [ "$FOLLOWUP" = "true" ] || { [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$GITHUB_REPO" ]; }; then
            echo "🔱 Running checks in no-push mode..."
            # --locked stops the outer invocation from refreshing uv.lock before
            # the check runs.
            uv run --locked pre-commit.py --check
            # Trust guard, independent of which pre-commit.py the fork shipped:
            # a stale checker that ignores --check would run the mutating path
            # (auto-format/version-bump/lock-refresh) and still exit 0. Fail the
            # job if the committed tree was modified at all.
            echo "🔎 Verifying the checker left the committed tree unmodified..."
            git diff --exit-code HEAD
          else
            echo "🛠️ Internal PR — running full maintenance..."
            uv run pre-commit.py --ci
          fi
          echo "✨ Maintenance complete."

      # Fork PRs only: the read-only token here cannot comment on the PR, so
      # hand the checklist to the PRCheckFeedback workflow (which runs in the
      # base-repo context with a write token) via an artifact. always() so the
      # report is uploaded even when the check above fails.
      - name: Stage PR check feedback
        if: always() && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - name: Upload PR check report
        if: always() && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-report
          path: |
            pr_check_report.md
            pr_number.txt
          if-no-files-found: ignore

  version:
    needs: [ quality-check ]
    if: needs.quality-check.outputs.changes_pushed != 'true' && ((github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name == 'dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - id: version
        run: |
          VERSION=$(uv run python quasarr/providers/version.py)
          EPOCH=$(date +%s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "epoch=$EPOCH" >> $GITHUB_OUTPUT
          echo "🏷️ Detected version: $VERSION ($EPOCH)"

  build-wheel:
    needs: [ quality-check, version ]
    if: needs.quality-check.outputs.changes_pushed != 'true' && ((github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name == 'dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      attestation-id: ${{ steps.attest.outputs.attestation-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: |
          echo "📦 Building Python Wheel..."
          uv build
      - id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*.whl"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: ./dist/*

  build-exe:
    needs: [ quality-check, version ]
    if: needs.quality-check.outputs.changes_pushed != 'true' && ((github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name == 'dev'))
    runs-on: windows-latest
    timeout-minutes: 3
    env:
      TMP: "D:\\a\\temp"
      TEMP: "D:\\a\\temp"
      PYINSTALLER_CONFIG_DIR: ".pyinstaller-cache"
    steps:
      - run: mkdir D:\a\temp -Force
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: "win-build"
      - name: Cache PyInstaller Analysis
        uses: actions/cache@v6
        with:
          path: |
            build
            .pyinstaller-cache
          key: pyinstaller-analysis-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            pyinstaller-analysis-${{ runner.os }}-
      - shell: powershell
        run: |
          echo "🛡️ Disabling Real-time Monitoring..."
          Set-MpPreference -DisableRealtimeMonitoring $true
      - run: |
          echo "📥 Syncing dependencies..."
          uv sync --group build
      - run: |
          echo "🪟 Starting PyInstaller build..."
          uv run python -c "from PIL import Image; Image.open('Quasarr.png').save('Quasarr.ico')"
          uv run python quasarr/providers/version.py --create-version-file
          uv run pyinstaller --collect-submodules quasarr.search.sources --collect-submodules quasarr.downloads.sources --collect-submodules charset_normalizer --onefile -y --version-file "file_version_info.txt" --workpath "build" --distpath "dist" --icon "Quasarr.ico" "Quasarr.py" -n "quasarr-${{ needs.version.outputs.version }}-standalone-win64"
          echo "✅ EXE build finished."
      - uses: actions/upload-artifact@v7
        with:
          name: exe-amd64
          path: ./dist/*.exe

  beta-release:
    needs: [ version, build-wheel, build-exe ]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Move beta tag to current commit
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "🏷️ Moving beta tag to $TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f beta "$TARGET_SHA"
          git push origin refs/tags/beta --force
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: ./wheel
      - uses: actions/download-artifact@v8
        with:
          name: exe-amd64
          path: ./exe-amd64
      - id: changelog
        uses: metcalfc/changelog-generator@v4.9.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Create Release Body
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          echo "📝 Generating Release Body..."
          echo "### Docker:" >> release_body.md
          echo "\`docker pull ${{ env.GHCR_ENDPOINT }}:beta\`" >> release_body.md
          echo "### Python:" >> release_body.md
          echo "\`uv tool install https://github.com/rix1337/Quasarr/releases/download/beta/quasarr-${{ needs.version.outputs.version }}-py3-none-any.whl\`" >> release_body.md
          echo "### Changelog:" >> release_body.md
          printf '%s\n' "$CHANGELOG" >> release_body.md
          echo "[Attestation](https://github.com/${{ github.repository }}/attestations/${{ needs.build-wheel.outputs.attestation-id }})" >> release_body.md
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "./wheel/*.whl,./exe-amd64/*.exe"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          tag: beta
          name: "${{ needs.version.outputs.version }} (${{ needs.version.outputs.epoch }})"
          bodyFile: "release_body.md"
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-docker-amd64:
    needs: [ quality-check, version, build-wheel ]
    if: needs.quality-check.outputs.changes_pushed != 'true' && ((github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name == 'dev'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: ./docker/dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          annotations: org.opencontainers.image.description=${{ env.DESCRIPTION }}
          tags: |
            ${{ env.GHCR_ENDPOINT }}:beta-amd64
            ${{ env.GHCR_ENDPOINT }}:${{ needs.version.outputs.version }}-beta-amd64
          build-args: VS=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=beta-amd64
          cache-to: type=gha,mode=max,scope=beta-amd64

  build-docker-arm64:
    needs: [ quality-check, version, build-wheel ]
    if: needs.quality-check.outputs.changes_pushed != 'true' && ((github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref_name == 'dev'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: ./docker/dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          annotations: org.opencontainers.image.description=${{ env.DESCRIPTION }}
          tags: |
            ${{ env.GHCR_ENDPOINT }}:beta-arm64
            ${{ env.GHCR_ENDPOINT }}:${{ needs.version.outputs.version }}-beta-arm64
          build-args: VS=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=beta-arm64
          cache-to: type=gha,mode=max,scope=beta-arm64

  merge-docker-manifest:
    needs: [ version, build-docker-amd64, build-docker-arm64 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          echo "🔗 Merging Docker manifests..."
          TAG_AMD64="${{ needs.version.outputs.version }}-beta-amd64"
          TAG_ARM64="${{ needs.version.outputs.version }}-beta-arm64"
          ANNOTATION="index:org.opencontainers.image.description=$DESCRIPTION"
          
          docker buildx imagetools create -t ${{ env.GHCR_ENDPOINT }}:beta \
            --annotation "$ANNOTATION" \
            ${{ env.GHCR_ENDPOINT }}:beta-amd64 \
            ${{ env.GHCR_ENDPOINT }}:beta-arm64

          docker buildx imagetools create -t ${{ env.GHCR_ENDPOINT }}:${{ needs.version.outputs.version }}-beta \
            --annotation "$ANNOTATION" \
            ${{ env.GHCR_ENDPOINT }}:${TAG_AMD64} \
            ${{ env.GHCR_ENDPOINT }}:${TAG_ARM64}

  notify:
    name: Notify PR
    needs: [ quality-check, version, beta-release, merge-docker-manifest ]
    if: needs.quality-check.outputs.changes_pushed != 'true' && needs.beta-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Send Notifications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          EPOCH: ${{ needs.version.outputs.epoch }}
          REPO: ${{ github.repository }}
        run: |
          echo "📢 Notifying stakeholders..."
          RELEASE_BODY=$(gh release view beta --json body --jq .body)
          PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            echo "## 🚀 Beta Release $VERSION is Live!" > pr_comment.md
            echo "$RELEASE_BODY" >> pr_comment.md
            gh pr comment "$PR_NUMBER" --body-file pr_comment.md
          fi

  job-summary:
    name: 📊 Beta Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    needs: [ quality-check, version, beta-release ]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🧪 Beta Build Summary" >> $GITHUB_STEP_SUMMARY
          
          # Maintenance Outcome
          if [[ "${{ needs.quality-check.outputs.changes_pushed }}" == "true" ]]; then
            echo "### 🛠️ Maintenance Status: **Auto-Fixed**" >> $GITHUB_STEP_SUMMARY
            echo "The script found formatting or dependency issues and pushed fixes directly. The current build was skipped to allow the new commit to run." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✨ Maintenance Status: **Clean**" >> $GITHUB_STEP_SUMMARY
            echo "No formatting or maintenance issues were detected." >> $GITHUB_STEP_SUMMARY
          fi

          # Decision Logic
          echo "### 🚦 Workflow Decision" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.version.result }}" == "success" ]]; then
            echo "✅ **Proceeded:** The build moved to beta release (Dev branch detected)." >> $GITHUB_STEP_SUMMARY
          else
            echo "🛑 **Stopped:** Build did not proceed to release (Not on dev or quality-check failed)." >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📦 Artifact Details" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.version.outputs.version || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Epoch** | \`${{ needs.version.outputs.epoch || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Job** | ${{ needs.beta-release.result || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
